<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f5f5">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.svg" type="image/svg+xml">
<title>账本</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="app">
  <!-- 记账页面 -->
  <div class="page active" id="page-record">
    <div class="nav-bar">
      <div class="nav-title">记账</div>
      <button class="nav-btn icon" onclick="App.showAbout()" title="关于与存储">⚙</button>
    </div>

    <div class="storage-status-bar" id="storageStatusBar"></div>

    <div class="install-banner hidden" id="installBanner">
      <span class="install-text">装到桌面后文件权限会自动保留，不用再反复授权</span>
      <button class="install-btn" onclick="App.installApp()">安装</button>
      <button class="install-close" onclick="App.dismissInstallBanner()" title="不再提示">×</button>
    </div>

    <div class="stats-bar">
      <div class="card stat">
        <div class="card-label">收入</div>
        <div class="card-value income" id="todayIncome">+0.00</div>
      </div>
      <div class="card stat">
        <div class="card-label">支出</div>
        <div class="card-value expense" id="todayExpense">-0.00</div>
      </div>
      <div class="card stat">
        <div class="card-label">结余</div>
        <div class="card-value" id="todayNet">+0.00</div>
      </div>
    </div>

    <div class="input-area">
      <div class="type-switch">
        <button id="btnExpense" class="expense active" onclick="App.setType('expense')">支出</button>
        <button id="btnIncome" class="income" onclick="App.setType('income')">收入</button>
      </div>
      <div class="input-row">
        <input type="text" id="inputSource" placeholder="物品/来源" autocomplete="off" class="input-source">
        <input type="number" id="inputAmount" placeholder="金额" step="0.01" min="0" class="input-amount">
        <button class="add-btn" id="addBtn" onclick="App.addRecord()" style="background:var(--color-expense);">✓</button>
      </div>
    </div>

    <div class="section-title">今日记录 · <span id="recordDateLabel" style="color:var(--color-text-hint);font-weight:normal;"></span></div>
    <div id="recordList" class="record-list"></div>
  </div>

  <!-- 总结页面 -->
  <div class="page" id="page-summary">
    <div class="nav-bar">
      <div class="nav-title">总结</div>
      <button class="nav-btn icon" onclick="App.exportCSV()" title="导出 CSV">⇩</button>
    </div>

    <div class="view-switch">
      <button id="viewDay" class="active" onclick="App.setSummaryView('day')">日</button>
      <button id="viewMonth" onclick="App.setSummaryView('month')">月</button>
      <button id="viewYear" onclick="App.setSummaryView('year')">年</button>
    </div>

    <div class="date-nav">
      <button onclick="App.navSummary(-1)">◀</button>
      <div class="date-label" id="summaryDateLabel"></div>
      <button onclick="App.navSummary(1)">▶</button>
    </div>

    <div class="stats-bar">
      <div class="card stat">
        <div class="card-label">收入</div>
        <div class="card-value income" id="summaryIncome">+0.00</div>
      </div>
      <div class="card stat">
        <div class="card-label">支出</div>
        <div class="card-value expense" id="summaryExpense">-0.00</div>
      </div>
      <div class="card stat">
        <div class="card-label">净收入</div>
        <div class="card-value" id="summaryNet">+0.00</div>
      </div>
    </div>

    <div id="summaryContent" class="content-area"></div>
  </div>

  <!-- 明细页面 -->
  <div class="page" id="page-detail">
    <div class="nav-bar">
      <div class="nav-title">明细</div>
      <button class="nav-btn icon" onclick="App.showStats()" title="统计">⌘</button>
    </div>

    <div class="filter-bar">
      <button onclick="App.detailNav(-1)">◀</button>
      <div class="current" id="detailLabel"></div>
      <button onclick="App.detailNav(1)">▶</button>
      <button class="toggle-btn" id="showAllBtn" onclick="App.toggleShowAll()">全部</button>
    </div>

    <div class="stats-bar">
      <div class="card stat">
        <div class="card-label">收入</div>
        <div class="card-value income" id="detailIncome">+0.00</div>
      </div>
      <div class="card stat">
        <div class="card-label">支出</div>
        <div class="card-value expense" id="detailExpense">-0.00</div>
      </div>
      <div class="card stat">
        <div class="card-label">净收入</div>
        <div class="card-value" id="detailNet">+0.00</div>
      </div>
    </div>

    <div id="detailContent" class="content-area"></div>
  </div>

  <!-- 底部 tab-bar -->
  <div class="tab-bar">
    <button class="tab-btn" id="tabRecord" onclick="App.showPage('record')">
      <span class="tab-icon">✎</span>
      <span class="tab-label">记账</span>
    </button>
    <button class="tab-btn" id="tabSummary" onclick="App.showPage('summary')">
      <span class="tab-icon">▤</span>
      <span class="tab-label">总结</span>
    </button>
    <button class="tab-btn" id="tabDetail" onclick="App.showPage('detail')">
      <span class="tab-icon">☰</span>
      <span class="tab-label">明细</span>
    </button>
  </div>
</div>

<!-- 编辑弹窗 -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>编辑记录</h3>
    <div class="type-switch" style="margin-bottom:12px;">
      <button id="editExpense" class="expense active" onclick="App.setEditType('expense')">支出</button>
      <button id="editIncome" class="income" onclick="App.setEditType('income')">收入</button>
    </div>
    <input type="text" id="editSource" placeholder="来源/物品">
    <input type="number" id="editAmount" placeholder="金额" step="0.01" min="0">
    <div class="modal-actions">
      <button class="btn-secondary" onclick="App.closeEdit()">取消</button>
      <button class="btn-danger" onclick="App.deleteEdit()">删除</button>
      <button class="btn-primary" onclick="App.saveEdit()">保存</button>
    </div>
  </div>
</div>

<!-- 统计弹窗 -->
<div class="modal-overlay" id="statsModal">
  <div class="modal">
    <h3>数据统计</h3>
    <div id="statsContent" class="stats-content"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="App.closeStats()">关闭</button>
      <button class="btn-primary" onclick="App.exportCSV()">导出CSV</button>
    </div>
  </div>
</div>

<!-- 关于弹窗 -->
<div class="modal-overlay" id="aboutModal">
  <div class="modal modal-wide">
    <h3>账本 · 关于</h3>
    <div class="about-content">
      <p>极简本地记账应用</p>
      <p class="version">版本 2.3.0 · CSV 文件存储</p>
      <hr>
      <div id="aboutStorageInfo" class="about-storage-info"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-primary" onclick="App.closeAbout()">确定</button>
    </div>
  </div>
</div>

<!-- 加载提示 -->
<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">加载中...</div>
</div>

<script src="./app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js');
  });
}
</script>
</body>
</html>
